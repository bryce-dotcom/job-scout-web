# Publish the JobScout Agent — signed.
#
# Run by hand (Actions → Agent release → Run workflow). It is not on a
# schedule and not on push: publishing here replaces the program customers
# download and run on their own machines, which is not something that should
# happen because somebody merged a branch.
#
# WHY IT LIVES IN CI AT ALL. The signing credentials are an identity that can
# make Windows trust a program as HHH. They belong in repository secrets with
# an audit trail, not in a .env on whoever happens to be doing the release.
#
# UNTESTED UNTIL A CERTIFICATE EXISTS. Trusted Signing needs an identity
# validation that takes days, so this file was written against Microsoft's
# documented inputs and has never run green. Expect to fix something the
# first time; the build and publish halves are the parts already proven.
#
# SECRETS IT NEEDS
#   AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET
#       an Entra app registration holding the "Trusted Signing Certificate
#       Profile Signer" role on the signing account
#   TRUSTED_SIGNING_ENDPOINT      e.g. https://wus2.codesigning.azure.net
#   TRUSTED_SIGNING_ACCOUNT       the Trusted Signing account name
#   TRUSTED_SIGNING_PROFILE       the certificate profile name
#   VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY / SUPABASE_SERVICE_ROLE_KEY
#       where the release is published; the anon key is baked into the
#       launchers and is public by design, the service key is not

name: Agent release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to the agent-releases bucket (otherwise build and sign only)'
        type: boolean
        default: false

jobs:
  windows:
    # Windows, because signing and the Authenticode check are Windows tools.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: npm ci

      # Build only. The exe is written to dist-agent and nothing is uploaded.
      - name: Build the agent
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run agent:release -- --exe --dry-run

      - name: Sign it
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist-agent
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Asked of Windows, not inferred from the signing step exiting 0. A
      # step that "succeeded" and left the file unsigned is exactly the
      # failure that would otherwise reach customers.
      - name: Check the signature really took
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature -LiteralPath "dist-agent\JobScoutAgent.exe"
          "status: $($sig.Status)"
          "signer: $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "not signed: $($sig.Status) $($sig.StatusMessage)" }

      - uses: actions/upload-artifact@v4
        with:
          name: JobScoutAgent
          path: dist-agent/JobScoutAgent.exe

      # Only now, and only when asked. The release script re-checks the
      # signature itself and refuses to upload an unsigned binary, so this
      # cannot publish one even if the step above is ever removed.
      - name: Publish
        if: ${{ inputs.publish }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run agent:release -- --exe --exe-prebuilt

  macos:
    # A real Mac: lipo, codesign, notarytool and stapler are all Mac-only.
    # Deno cross-compiles the binaries from anywhere, so only this half has to
    # be here.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: npm ci

      # Builds both architectures, lipos them into one universal binary (it is
      # on a Mac, so it really is universal here) and assembles the .app.
      - name: Build JobScout Agent.app
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run agent:release -- --mac --dry-run

      # The certificate lives in a keychain that exists only for this run.
      # Importing into the login keychain would leave it on a shared runner
      # image's disk for whatever runs next.
      - name: Load the Developer ID certificate
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      # Innermost code first, then the bundle that seals it. Signing the
      # bundle before its contents are final is a documented way to get a
      # notarization rejection that reads like nonsense.
      - name: Sign
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          APP="dist-agent/JobScout Agent.app"
          codesign --force --timestamp --options runtime \
            --entitlements scripts/agent/mac/entitlements.plist \
            --sign "$IDENTITY" "$APP/Contents/MacOS/jobscout-agent"
          codesign --force --timestamp --options runtime \
            --entitlements scripts/agent/mac/entitlements.plist \
            --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      # ditto, not zip: a plain zip drops the symlinks and extended attributes
      # a signature is made of, and what arrives at Apple is no longer signed.
      - name: Notarize and staple
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          APP="dist-agent/JobScout Agent.app"
          echo "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER" \
            --wait --timeout 30m
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          # Stapling is what lets it open on a job site with no signal.
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"

      # The question Gatekeeper itself asks when somebody double-clicks it.
      # codesign --verify alone passes on builds macOS still refuses to open,
      # and notarization never RUNS the program — a binary missing the JIT
      # entitlement notarizes cleanly and then dies on launch.
      - name: Ask Gatekeeper
        run: spctl --assess --type execute --verbose=2 "dist-agent/JobScout Agent.app"

      - uses: actions/upload-artifact@v4
        with:
          name: JobScoutAgent-mac
          path: dist-agent/JobScout Agent.app

      - name: Publish
        if: ${{ inputs.publish }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run agent:release -- --mac --mac-prebuilt
